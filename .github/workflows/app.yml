name: App

# Jeder Push: im Simulator bauen und testen (ohne Geheimnisse).
# Tag beta-*: zusätzlich signieren und zu TestFlight hochladen. Geheimnisse nur hier, nie bei Pull Requests.
on:
  push:
    branches: [main]
    tags: ["beta-*", "probe-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Im Simulator bauen und testen
        run: |
          ziel=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          geraete = json.load(sys.stdin)['devices']
          print(next(g['udid'] for laufzeit in sorted(geraete, reverse=True) if 'iOS' in laufzeit
                     for g in geraete[laufzeit] if g['name'].startswith('iPhone')))")
          echo "Simulator: $ziel"
          set -o pipefail
          xcodebuild test -project PersonalAPI.xcodeproj -scheme PersonalAPI             -destination "id=$ziel" | grep -E "error:|warning: unre|Test Case|Executed|\*\* TEST|BUILD" | tail -n 60

      - name: Signieren und zu TestFlight hochladen
        if: startsWith(github.ref, 'refs/tags/beta-') || startsWith(github.ref, 'refs/tags/probe-')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NUR_PRUEFEN: ${{ startsWith(github.ref, 'refs/tags/probe-') && '1' || '' }}
        run: ci/testflight.sh
