# Xcode-Projekt wird auf dem Bauserver mit XcodeGen erzeugt (kein Mac nötig): xcodegen generate
name: PersonalAPI
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PersonalAPI:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Personal API
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Probe: Ist HTTP an eine IP-Adresse im Heimnetz damit erlaubt? (kein NSAllowsArbitraryLoads)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Die App spricht mit deinem eigenen Server im Heimnetz.
        NSCameraUsageDescription: Die Kamera liest den QR-Code, mit dem du die App mit deinem Server koppelst.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.userpo70.personalapi
            CFBundleURLSchemes: [personal-api]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.userpo70.personalapi
        PRODUCT_NAME: PersonalAPI
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: [PersonalAPITests]
  PersonalAPITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PersonalAPI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.userpo70.personalapi.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PersonalAPI.app/PersonalAPI
        BUNDLE_LOADER: $(TEST_HOST)
